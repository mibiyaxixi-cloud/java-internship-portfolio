server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13308/knowledge?connectionTimeZone=UTC}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 270KB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    clean-disabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 10
app:
  ai-mode: ${AI_MODE:mock}
  chat-base-url: ${CHAT_BASE_URL:}
  chat-api-key: ${CHAT_API_KEY:}
  chat-model: ${CHAT_MODEL:}
  embedding-base-url: ${EMBEDDING_BASE_URL:}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
  qdrant-url: ${QDRANT_URL:http://127.0.0.1:16333}
  qdrant-api-key: ${QDRANT_API_KEY:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  chunk-size: ${CHUNK_SIZE:600}
  chunk-overlap: ${CHUNK_OVERLAP:80}
  top-k: ${TOP_K:4}
  min-score: ${MIN_SCORE:0.20}
  admin-password: ${ADMIN_PASSWORD:}
  reader-password: ${READER_PASSWORD:}
  reader2-password: ${READER2_PASSWORD:}
guard:
  login-per-minute: ${LOGIN_PER_MINUTE:10}
  questions-per-minute: ${QUESTIONS_PER_MINUTE:20}
  imports-per-minute: ${IMPORTS_PER_MINUTE:30}
  max-concurrent-questions: ${MAX_CONCURRENT_QUESTIONS:4}
  max-concurrent-imports: ${MAX_CONCURRENT_IMPORTS:2}
  qdrant-timeout-seconds: ${QDRANT_TIMEOUT_SECONDS:10}
  ai-deadline-seconds: ${AI_DEADLINE_SECONDS:35}

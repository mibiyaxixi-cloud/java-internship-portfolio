spring:
  application:
    name: bookflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
      # 使用固定偏移，不要求新 MySQL 实例预先导入命名时区表。
      connection-init-sql: "SET time_zone = '+08:00'"
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

bookflow:
  waitlist:
    offer-seconds: ${WAITLIST_OFFER_SECONDS:900}
    scan-delay-ms: ${WAITLIST_SCAN_DELAY_MS:5000}
  scheduling:
    enabled: ${WAITLIST_SCHEDULING_ENABLED:true}

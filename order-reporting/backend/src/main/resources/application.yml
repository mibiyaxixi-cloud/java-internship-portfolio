server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ORDERREPORTSESSION
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 15
